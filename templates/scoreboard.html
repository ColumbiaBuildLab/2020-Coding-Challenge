<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2020 NHL Scoreboard</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='scoreboard.js') }}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <script>
      var scoreboard = {{scoreboard|tojson}}
    </script>
   <style>
     body{ min-height:100vh; background:linear-gradient(180deg,#0b2545,#13315c); color:#fff; font-family:system-ui,sans-serif; padding-bottom:60px; }
     .hero{ text-align:center; padding:40px 16px 8px; }
     #title{ font-size:40px; font-weight:800; margin:8px 0 4px; }
     #title span{ background:linear-gradient(90deg,#ffb703,#e63946); -webkit-background-clip:text; background-clip:text; color:transparent; }
     .subtitle{ color:#a8c5e3; font-size:14px; margin-bottom:22px; }
     .board-card{ max-width:720px; margin:0 auto; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:18px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.35); }
     .board-header{ display:flex; justify-content:space-between; align-items:center; padding:14px 20px; font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:#8ea8c3; font-weight:700; border-bottom:1px solid rgba(255,255,255,.1); }
     .live-dot{ color:#80ed99; }
     #teams{ padding:12px; }
     .team-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; margin:8px 4px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:12px; will-change:transform; }
     .team-row.leader{ background:linear-gradient(135deg,rgba(255,183,3,.25),rgba(251,133,0,.12)); border-color:rgba(255,183,3,.5); }
     .rank-badge{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; background:rgba(255,255,255,.12); flex-shrink:0; }
     .leader .rank-badge{ background:linear-gradient(135deg,#ffb703,#fb8500); color:#0b2545; }
     .team-main{ flex:1; min-width:0; }
     .team-name{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
     .team-sub{ font-size:12px; color:#8ea8c3; }
     .score-bar{ height:6px; background:rgba(255,255,255,.12); border-radius:99px; margin-top:7px; overflow:hidden; }
     .score-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg,#80ed99,#48cae4); transition:width .4s ease; }
     .score-pill{ min-width:48px; text-align:center; font-size:20px; font-weight:800; background:rgba(0,0,0,.3); border-radius:10px; padding:3px 8px; }
     .score-pill.bump{ animation:bump .4s ease; }
     @keyframes bump{ 0%{transform:scale(1);} 40%{transform:scale(1.3);} 100%{transform:scale(1);} }
     .increase-button{ width:40px; height:40px; border-radius:50%; border:none; font-size:20px; font-weight:800; color:#0b2545; background:linear-gradient(135deg,#80ed99,#48cae4); cursor:pointer; }
     .increase-button:hover{ transform:scale(1.07); }
     .increase-button:disabled{ opacity:.6; }
     .hint{ text-align:center; color:#8ea8c3; font-size:13px; margin-top:16px; }
   </style>
  </head>
  <body>
    <div class="container">
      <div class="hero">
        <div style="font-size:44px">🏒</div>
        <div id="title">2020 NHL <span>Scoreboard</span></div>
        <div class="subtitle">Live standings &bull; click + to cheer &bull; auto-sorts</div>
      </div>
      <div class="board-card">
        <div class="board-header"><span>Atlantic Division</span><span class="live-dot">● Live</span></div>
        <div class="contents"><div id="teams"></div></div>
      </div>
      <div class="hint">Scores update instantly &amp; re-sort - no refresh needed</div>
    </div>
  </body>
</html>
